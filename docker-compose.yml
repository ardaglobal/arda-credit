# Docker Compose for Local Development
# Usage: docker-compose up -d
#
# This runs only the essential services needed for local development:
# - PostgreSQL database
#
# For tracing, we use SigNoz Cloud for both local development and production.
# This provides consistency across environments and eliminates the need for
# local tracing infrastructure.
#
# Run your Arda Credit API server separately with: cargo run --bin server

services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: arda_credit_postgres
    environment:
      POSTGRES_DB: arda_credit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-monitoring.sql:/docker-entrypoint-initdb.d/01-monitoring.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL Exporter for Prometheus monitoring
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: arda_credit_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@postgres:5432/arda_credit_db?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    ports:
      - "9187:9187"
    volumes:
      - ./scripts/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9187/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
