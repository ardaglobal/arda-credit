# Docker Compose for Local Development
# Usage: docker-compose up -d
#
# This runs the essential services needed for local development:
# - PostgreSQL database
# - Prometheus for metrics collection
# - Grafana for metrics visualization
#
# For tracing, we use SigNoz Cloud for both local development and production.
# This provides consistency across environments and eliminates the need for
# local tracing infrastructure.
#
# Run your Arda Credit API server separately with: cargo run --bin server

services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: arda_credit_postgres
    environment:
      POSTGRES_DB: arda_credit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: arda_credit_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - postgres

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: arda_credit_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3100:3100" # changed from 3000 to 3100 to not conflict with frontend default port
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus

  # Anvil - Local Ethereum devnet (for local/staging environments)
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: arda_credit_anvil
    entrypoint: []
    command:
      - anvil
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
      - --block-time
      - "2"
      - --state
      - /anvil-state/state.json
      - --state-interval
      - "10"
    ports:
      - "8545:8545"
    volumes:
      - anvil_data:/anvil-state
    restart: unless-stopped
    profiles:
      - local
      - staging
  # FastMCP Proxy - MCP Server Proxy
  mcp-proxy:
    image: ghcr.io/ardaglobal/fastmcp-proxy:latest
    container_name: fastmcp_proxy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MCP Proxy Server
      - APP_VERSION=0.1.0
      - DEBUG=${MCP_DEBUG:-false}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-https://arda-insights.fastmcp.app/mcp}
      - MCP_TIMEOUT=${MCP_TIMEOUT:-30.0}
      - API_KEYS=${MCP_PROXY_API_KEYS:-dev-key-123}
      - CORS_ORIGINS=${MCP_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      - LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  anvil_data:
