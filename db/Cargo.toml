[package]
edition = "2021"
license = "MIT"
name    = "db"
version = "0.0.1"

# Removed: populate_fake_data binary (depends on removed credit_line_operations)
# [[bin]]
# name = "populate_fake_data"
# path = "src/bin/populate_fake_data.rs"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.11", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.1", optional = true }

[features]
default    = [ "tikv-jemallocator" ]
test-utils = [  ]

[dependencies]
chrono = { workspace = true, features = [ "serde" ] }
lib = { path = "../lib" }
rust_decimal = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, features = [
    "chrono",
    "json",
    "postgres",
    "runtime-tokio-rustls",
    "rust_decimal",
    "uuid",
] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = [ "serde", "v4" ] }

# SP1 and arithmetic dependencies
alloy-sol-types = { workspace = true }
sindri          = { workspace = true, features = [ "sp1-v5" ] }
sp1-sdk         = { workspace = true }

# Utility dependencies (kept for non-API uses)
async-trait = "0.1"
blake3      = "1"
env_logger  = "0.11"
hex         = { workspace = true }
ipnetwork   = { version = "0.21", features = [ "serde" ] }
rand        = "0.9"
serde_json  = { workspace = true }
sha2        = { workspace = true }
url         = { workspace = true }

# Poseidon hash for ZK-friendly Merkle trees (via lib crate)
# Dependencies provided by lib crate

[dev-dependencies]
tempfile           = "3.21"
tracing-subscriber = { workspace = true }
tracing-test       = "0.2"
uuid               = { workspace = true, features = [ "v4" ] }
