[package]
edition = "2021"
license = "MIT"
name    = "lib"
version = "0.0.1"

[dependencies]
# Core types (zkVM compatible)
alloy-sol-types = { workspace = true }
hex             = { workspace = true }
serde           = { workspace = true, features = [ "derive" ] }
serde_json      = { workspace = true }
thiserror       = { workspace = true }

# Additional dependencies for loan types
blake3       = "1.5"                # For nullifier generation consistency
rust_decimal = { workspace = true }
sha2         = { workspace = true }
uuid         = { workspace = true }

# Poseidon hash (zkVM compatible)
p3-baby-bear = { workspace = true }
p3-field     = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-symmetric = { workspace = true }
rand         = "0.8"

# SP1 dependencies (for host-side proof operations)
chrono  = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
sindri  = { workspace = true, features = [ "sp1-v5" ], optional = true }
sp1-sdk = { workspace = true, optional = true }
tokio   = { workspace = true, features = [ "time" ], optional = true }
tracing = { workspace = true, optional = true }

# CLI dependencies
clap = { workspace = true, features = [ "derive" ], optional = true }

[features]
clap    = [ "dep:clap" ]
default = [  ]
sp1     = [ "dep:chrono", "dep:metrics", "dep:sindri", "dep:sp1-sdk", "dep:tokio", "dep:tracing" ]
