[package]
edition = "2021"
license = "MIT"
name    = "lib"
version = "0.0.1"

[dependencies]
# Core types (zkVM compatible)
alloy-sol-types = { workspace = true }
hex             = { workspace = true }
serde           = { workspace = true, features = [ "derive" ] }
serde_json      = { workspace = true }
thiserror       = { workspace = true }

# Additional dependencies for loan types
blake3       = "1.5"                # For nullifier generation consistency
rust_decimal = { workspace = true }
sha2         = { workspace = true }
uuid         = { workspace = true }

# SP1 dependencies (for host-side proof operations)
metrics = { workspace = true, optional = true }
sindri  = { workspace = true, features = [ "sp1-v5" ], optional = true }
sp1-sdk = { workspace = true, optional = true }
tokio   = { workspace = true, features = [ "time" ], optional = true }
tracing = { workspace = true, optional = true }

# CLI dependencies
clap = { workspace = true, features = [ "derive" ], optional = true }

# AWS S3 and document storage dependencies
aws-config  = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-sdk-s3  = { workspace = true, optional = true }
chrono      = { workspace = true, optional = true }
mime        = { workspace = true, optional = true }
mime_guess  = { workspace = true, optional = true }
validator   = { workspace = true, optional = true }

[features]
clap = [ "dep:clap" ]
default = [  ]
document_storage = [
    "dep:aws-config",
    "dep:aws-sdk-kms",
    "dep:aws-sdk-s3",
    "dep:chrono",
    "dep:mime",
    "dep:mime_guess",
    "dep:validator",
]
sp1 = [ "dep:metrics", "dep:sindri", "dep:sp1-sdk", "dep:tokio", "dep:tracing" ]
