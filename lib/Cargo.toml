[package]
edition = "2021"
license = "MIT"
name    = "lib"
version = "0.0.1"

[dependencies]
# Core types (zkVM compatible)
alloy-sol-types = { workspace = true }
hex             = "0.4"
serde           = { version = "1.0", features = [ "derive" ] }
serde_json      = "1.0"
thiserror       = "2.0"

# Additional dependencies for loan types
blake3       = "1.5"                # For nullifier generation consistency
rust_decimal = { workspace = true }
sha2         = { workspace = true }
uuid         = { workspace = true }

# SP1 dependencies (for host-side proof operations)
metrics = { workspace = true, optional = true }
sindri  = { version = "0.3.1", features = [ "sp1-v5" ], optional = true }
sp1-sdk = { version = "5.2.1", optional = true }
tokio   = { version = "1.0", features = [ "time" ], optional = true }
tracing = { version = "0.1", optional = true }

# CLI dependencies
clap = { version = "4.5", features = [ "derive" ], optional = true }

# AWS S3 and document storage dependencies
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
mime = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
validator = { workspace = true, optional = true }

[features]
clap    = [ "dep:clap" ]
default = [  ]
document_storage = [ "dep:aws-config", "dep:aws-sdk-s3", "dep:aws-sdk-kms", "dep:chrono", "dep:mime", "dep:mime_guess", "dep:validator" ]
sp1     = [ "dep:metrics", "dep:sindri", "dep:sp1-sdk", "dep:tokio", "dep:tracing" ]
