[package]
edition = "2021"
license = "MIT"
name    = "api"
version = "0.0.1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.11", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.1", optional = true }

[features]
default = [ "tikv-jemallocator" ]

[dependencies]
# Core dependencies
chrono       = { workspace = true, features = [ "serde" ] }
once_cell    = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true, features = [ "serde", "v4" ] }

# Database and arithmetic dependencies
alloy-network      = { workspace = true }
alloy-primitives   = { workspace = true }
alloy-provider     = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-sol-types    = { workspace = true }
anyhow             = { workspace = true }
arda-credit-db     = { path = "../db", package = "db" }
arda-credit-lib    = { path = "../lib", package = "lib", features = [ "sp1" ] }
bincode            = { workspace = true, features = [ "serde" ] }
ethereum-client    = { path = "../ethereum-client" }
sindri             = { workspace = true, features = [ "sp1-v5" ] }
sp1-sdk            = { workspace = true }
sqlx               = { workspace = true, features = [ "chrono", "ipnetwork", "postgres", "uuid" ] }

# API framework dependencies
async-graphql = { version = "7.1", features = [ "chrono" ] }
async-graphql-axum = "7.1"
async-stream = "0.3"
async-trait = "0.1"
axum = { workspace = true, features = [ "multipart", "ws" ] }
futures-util = "0.3"
hex = { workspace = true }
http = "1.4"
hyper = "1.8"
serde_json = { workspace = true }
tokio-stream = "0.1"
tower = { version = "0.5", features = [ "util" ] }
tower-http = { version = "0.6", features = [
    "compression-gzip",
    "cors",
    "limit",
    "timeout",
    "trace",
] }

# Server binary dependencies
clap               = { workspace = true, features = [ "derive" ] }
dotenv             = { workspace = true }
tokio-util         = "0.7"
tracing-subscriber = { workspace = true, features = [ "env-filter" ] }

# HTTP client dependencies
reqwest = { workspace = true, features = [ "json" ] }

# Authentication dependencies
jsonwebtoken = { version = "10.2", features = [ "aws_lc_rs" ] } # JWT token generation/validation
validator    = { workspace = true, features = [ "derive" ] }    # Email validation

# AWS SES Integration
aws-config    = { workspace = true }
aws-sdk-sesv2 = "1.101"

# Email template support
askama = "0.14"

# Session management dependencies
axum-extra = { version = "0.12", features = [ "cookie" ] }
base64     = "0.22"
# Note: IpNetwork is re-exported from sqlx::types::ipnetwork (version 0.20)
time = "0.3"

# OpenTelemetry dependencies (compatible versions)
opentelemetry                      = { version = "0.31.0", features = [ "trace" ] }
opentelemetry-otlp                 = { version = "0.31.0", features = [ "trace" ] }
opentelemetry-semantic-conventions = { version = "0.31.0" }
opentelemetry_sdk                  = { version = "0.31.0", features = [ "rt-tokio" ] }
tonic                              = { version = "0.14.1", features = [ "tls-native-roots" ] }
tracing-opentelemetry              = { version = "0.32.0" }

# Middleware dependencies
blake3 = "1"
rand   = "0.9"
regex  = "1.12"
sha2   = { workspace = true }
url    = { workspace = true }

# Time formatting
humantime = "2"

# OpenAPI/Swagger documentation
utoipa            = { version = "5.4.0", features = [ "axum_extras", "chrono", "uuid" ] }
utoipa-swagger-ui = { version = "9.0.1", features = [ "axum" ] }

# Prometheus metrics
axum-prometheus             = { workspace = true }
metrics                     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-util                = { workspace = true }
prometheus                  = { workspace = true }
rayon                       = { workspace = true }

[dev-dependencies]

axum-test          = "18.2.1"
futures            = { workspace = true, features = [ "async-await" ] }
tempfile           = "3.24"
tracing-subscriber = { workspace = true }
tracing-test       = "0.2"
uuid               = { workspace = true, features = [ "v4" ] }
