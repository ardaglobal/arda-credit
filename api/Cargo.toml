[package]
edition = "2021"
license = "MIT"
name    = "api"
version = "0.0.1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.10", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.1", optional = true }

[features]
default = [ "tikv-jemallocator" ]

[dependencies]
# Core dependencies
chrono       = { version = "0.4", features = [ "serde" ] }
once_cell    = "1.19"
rust_decimal = "1.39"
serde        = { workspace = true }
thiserror    = "2.0"
tokio        = { workspace = true }
tracing      = { workspace = true }
uuid         = { version = "1.0", features = [ "serde", "v4" ] }

# Database and arithmetic dependencies
alloy-network      = { workspace = true }
alloy-primitives   = { workspace = true }
alloy-provider     = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-sol-types    = { workspace = true }
anyhow             = { workspace = true }
arda-credit-db     = { path = "../db", package = "db" }
arda-credit-lib    = { path = "../lib", package = "lib", features = [ "document_storage", "sp1" ] }
ethereum-client    = { path = "../ethereum-client" }
sindri             = { version = "0.3.1", features = [ "sp1-v5" ] }
sp1-sdk            = "5.2.2"
sqlx               = { workspace = true, features = [ "chrono", "ipnetwork", "postgres", "uuid" ] }

# API framework dependencies
async-graphql = { version = "7.0", features = [ "chrono" ] }
async-graphql-axum = "7.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { workspace = true, features = [ "multipart", "ws" ] }
futures-util = "0.3"
hex = "0.4"
http = "1.0"
hyper = "1.0"
serde_json = "1.0"
tokio-stream = "0.1"
tower = { version = "0.5", features = [ "util" ] }
tower-http = { version = "0.6", features = [
    "compression-gzip",
    "cors",
    "limit",
    "timeout",
    "trace",
] }

# Server binary dependencies
clap               = { version = "4.5", features = [ "derive" ] }
dotenv             = "0.15"
tokio-util         = "0.7"
tracing-subscriber = { workspace = true, features = [ "env-filter" ] }

# HTTP client dependencies
reqwest = { version = "0.12", features = [ "json" ] }

# Authentication dependencies
jsonwebtoken = { version = "10.1", features = [ "aws_lc_rs" ] } # JWT token generation/validation
validator    = { version = "0.20", features = [ "derive" ] }    # Email validation

# AWS SES Integration
aws-config    = "1.8"
aws-sdk-sesv2 = "1.100"

# Email template support
askama = "0.14"

# Session management dependencies
axum-extra = { version = "0.10", features = [ "cookie" ] }
base64     = "0.22"
ipnetwork  = { version = "0.20", features = [ "serde" ] }  # Must match sqlx's ipnetwork version
time       = "0.3"

# OpenTelemetry dependencies (compatible versions)
opentelemetry                      = { version = "0.31.0", features = [ "trace" ] }
opentelemetry-otlp                 = { version = "0.31.0", features = [ "trace" ] }
opentelemetry-semantic-conventions = { version = "0.31.0" }
opentelemetry_sdk                  = { version = "0.31.0", features = [ "rt-tokio" ] }
tonic                              = { version = "0.14.1", features = [ "tls-native-roots" ] }
tracing-opentelemetry              = { version = "0.32.0" }

# Middleware dependencies
blake3 = "1"
rand   = "0.9"
regex  = "1.12"
sha2   = "0.10"
url    = "2.5"

# Time formatting
humantime = "2"

# OpenAPI/Swagger documentation
utoipa            = { version = "5.4.0", features = [ "axum_extras", "chrono", "uuid" ] }
utoipa-swagger-ui = { version = "9.0.1", features = [ "axum" ] }

# Prometheus metrics
axum-prometheus             = { workspace = true }
metrics                     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-util                = { workspace = true }
prometheus                  = { workspace = true }

# Document ingestion dependencies
# PDF processing
lopdf       = "0.34" # PDF parsing and text extraction
pdf-extract = "0.10" # Alternative PDF extraction

# Excel/CSV processing
calamine = "0.28" # Excel (XLS/XLSX) parsing
csv      = "1.3"  # CSV parsing and writing

# Vector database
rustls = { version = "0.23", features = [
    "aws-lc-rs",
], default-features = false } # TLS crypto provider for SurrealDB WSS
surrealdb = { version = "2.3", features = [
    "protocol-ws",
    "rustls",
] } # SurrealDB client with vector support and WSS

# Text processing and embeddings
dashmap       = "6.1"  # Concurrent HashMap for embedding cache
rig-core      = "0.5"  # LLM and embedding framework for Rust
text-splitter = "0.28" # Semantic text chunking for embeddings

[dev-dependencies]

axum-test          = "18.1.0"
futures            = { version = "0.3", features = [ "async-await" ] }
tempfile           = "3.21"
tracing-subscriber = { workspace = true }
tracing-test       = "0.2"
uuid               = { version = "1.0", features = [ "v4" ] }
