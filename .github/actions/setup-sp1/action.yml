name: 'Setup SP1 Toolchain'
description: 'Install and cache SP1 toolchain for faster CI/CD builds'
inputs:
  cache-key-suffix:
    description: 'Additional suffix for cache key (useful for different SP1 versions)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Get SP1 cache key
      id: sp1-cache-key
      shell: bash
      run: |
        # Create a cache key based on the SP1 installation URL and optional suffix
        SP1_URL_HASH=$(echo "https://sp1.succinct.xyz" | sha256sum | cut -d' ' -f1)
        CACHE_KEY="sp1-toolchain-${SP1_URL_HASH}${{ inputs.cache-key-suffix }}"
        echo "cache-key=${CACHE_KEY}" >> $GITHUB_OUTPUT
        echo "sp1-bin-path=$HOME/.sp1/bin" >> $GITHUB_OUTPUT

    - name: Cache SP1 toolchain
      id: cache-sp1
      uses: actions/cache@v4
      with:
        path: ~/.sp1
        key: ${{ steps.sp1-cache-key.outputs.cache-key }}
        restore-keys: |
          sp1-toolchain-

    - name: Install SP1 toolchain
      if: steps.cache-sp1.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Installing SP1 toolchain..."
        curl -L https://sp1.succinct.xyz | bash
        # Set PATH temporarily for this step
        export PATH="$HOME/.sp1/bin:$PATH"
        # Run SP1 update tool
        sp1up
        echo "SP1 toolchain installation completed"

    - name: Add SP1 to PATH
      shell: bash
      run: |
        echo "${{ steps.sp1-cache-key.outputs.sp1-bin-path }}" >> $GITHUB_PATH

    - name: Verify SP1 installation
      shell: bash
      run: |
        # Verify installation by checking cargo-prove version
        export PATH="${{ steps.sp1-cache-key.outputs.sp1-bin-path }}:$PATH"
        cargo-prove prove --version
        echo "SP1 toolchain verification completed"

    - name: Cache info
      shell: bash
      run: |
        if [ "${{ steps.cache-sp1.outputs.cache-hit }}" = "true" ]; then
          echo "✅ SP1 toolchain loaded from cache"
        else
          echo "📦 SP1 toolchain installed and cached for future runs"
        fi
