# Developer note: This workflow does not pass locally with act, but does pass on GitHub Actions.
name: Security audit
permissions:
  checks: write
  contents: read
  security-events: write
on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"

concurrency:
  # One lane per PR or branch. New runs cancel older ones in that lane.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071
