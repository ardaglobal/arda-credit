name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

concurrency:
  # One lane per PR or branch. New runs cancel older ones in that lane.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Generate Code Coverage
    runs-on:
      # AWS Codebuild Trigger
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - run-id=${{ github.run_id }}

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools, rustc-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.rustup/
            ~/.sp1/circuits/plonk/
            ~/.sp1/circuits/groth16/
          key: rust-1.81.0-coverage-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: rust-1.81.0-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --token "${{ secrets.SP1_PAT }}"
          ~/.sp1/bin/cargo-prove prove --version

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # PostgreSQL readiness check commented out - GitHub Actions service health checks
      # already guarantee the database is ready before job steps execute
      # - name: Wait for PostgreSQL to be ready
      #  run: |
      #    echo "Waiting for PostgreSQL to be ready..."
      #    timeout 60s bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
      #    echo "PostgreSQL is ready!"

      - name: Generate code coverage
        env:
          # Optimized connection pool settings for CodeBuild environment with longer timeouts
          DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres?pool_max_size=20&connection_timeout=60
        run: |
          # Generate HTML report with limited concurrency to avoid database connection pool exhaustion
          cargo llvm-cov --workspace --all-features --html -- --test-threads=5
          # Generate JSON report for programmatic use
          cargo llvm-cov --workspace --all-features --json --output-path target/llvm-cov/coverage.json -- --test-threads=5
          # Generate text summary for display
          cargo llvm-cov --workspace --all-features --summary-only -- --test-threads=5 > target/llvm-cov/coverage-summary.txt

      - name: Display coverage summary
        run: |
          echo "=== Code Coverage Summary ==="
          if [ -f "target/llvm-cov/coverage-summary.txt" ]; then
            cat target/llvm-cov/coverage-summary.txt
          fi
          echo ""
          echo "Coverage report generated successfully!"
          echo "HTML report will be available in the artifacts section."

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-report
          path: target/llvm-cov/html/
          retention-days: 30

      - name: Upload JSON coverage data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-json-data
          path: target/llvm-cov/coverage.json
          retention-days: 30

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: target/llvm-cov/coverage-summary.txt
          retention-days: 30
