name: Build and Push Docker Image
on:
  push:
    branches:
      - main
  release:
    types: [published]
concurrency:
  # One lane per PR or branch. New runs cancel older ones in that lane.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on:
      # https://docs.aws.amazon.com/codebuild/latest/userguide/sample-github-action-runners-update-yaml.images.html
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }} image:ubuntu-7.0 instance-size:2xlarge
    permissions:
      contents: read
      packages: write  # Includes read access for pulling private base containers
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure maximum parallelism for high-CPU environment
        run: |
          {
            # Set Rust to use all 72 vCPUs
            echo "CARGO_BUILD_JOBS=72"
            echo "RUSTFLAGS=-C target-cpu=native"
            # Set BuildKit log buffer to 50MB (reduced from 100MB)
            echo "BUILDKIT_STEP_LOG_MAX_SIZE=50000000"
            # Cargo network optimizations
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
            echo "CARGO_HTTP_MULTIPLEXING=false"
          } >> $GITHUB_ENV
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          no-color: false
          no-fail: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.BUILDKIT_STEP_LOG_MAX_SIZE=${{ env.BUILDKIT_STEP_LOG_MAX_SIZE }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GH Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # For PRs, build single platform for speed
      # For releases/main, build multi-platform
      - name: Determine build platforms
        id: platforms
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            CARGO_BUILD_JOBS=${{ env.CARGO_BUILD_JOBS }}
            RUSTFLAGS=${{ env.RUSTFLAGS }}
          # Performance optimizations
          provenance: false
          sbom: false
          no-cache: false
          load: false
          outputs: type=image,push=true
