name: Helm Chart Release

on:
  push:
    branches:
      - main
      - infra/k8s
    paths:
      - 'helm/charts/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  release-helm-chart:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      chart_version: ${{ steps.check_version.outputs.chart_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          
      - name: Check for chart version changes
        id: check_version
        run: |
          CHART_PATH="helm/charts/arda-credit/Chart.yaml"
          if git diff HEAD~1 HEAD --name-only | grep -q "$CHART_PATH"; then
            CURRENT_VERSION=$(grep '^version:' $CHART_PATH | cut -d' ' -f2)
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "chart_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "📦 Chart version changed to: $CURRENT_VERSION"
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No version change detected"
          fi

      - name: Install Helm
        if: steps.check_version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Helm repositories
        if: steps.check_version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Update Helm dependencies
        if: steps.check_version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd helm/charts/arda-credit
          helm dependency build

      - name: Lint Helm chart
        if: steps.check_version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          helm lint helm/charts/arda-credit

      - name: Validate Helm templates
        if: steps.check_version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          helm template arda-credit helm/charts/arda-credit

      - name: Package Helm chart
        if: steps.check_version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .cr-release-packages
          helm package helm/charts/arda-credit --destination .cr-release-packages

      - name: Run chart-releaser
        if: steps.check_version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm/charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_RELEASE_NAME_TEMPLATE: "helm-chart-{{ .Name }}-{{ .Version }}"

  publish-to-ghcr:
    runs-on: ubuntu-latest
    needs: release-helm-chart
    if: success() && (needs.release-helm-chart.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Update Helm dependencies
        run: |
          cd helm/charts/arda-credit
          helm dependency build

      - name: Package and Push to GHCR
        run: |
          cd helm/charts/arda-credit
          CHART_VERSION=$(helm show chart . | grep '^version:' | cut -d' ' -f2)
          CHART_NAME=$(helm show chart . | grep '^name:' | cut -d' ' -f2)
          
          # Package the chart
          helm package .
          
          # Push to GHCR
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" oci://ghcr.io/${{ github.repository_owner }}/helm-charts
          
          echo "📦 Helm chart published to: ghcr.io/${{ github.repository_owner }}/helm-charts/${CHART_NAME}:${CHART_VERSION}"
          
  summary:
    runs-on: ubuntu-latest
    needs: [release-helm-chart, publish-to-ghcr]
    if: always()
    steps:
      - name: Release Summary
        run: |
          echo "## 📊 Helm Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.release-helm-chart.outputs.version_changed }}" == "true" ]]; then
            echo "✅ **Chart Version**: ${{ needs.release-helm-chart.outputs.chart_version }}" >> $GITHUB_STEP_SUMMARY
            echo "✅ **GitHub Release**: Created" >> $GITHUB_STEP_SUMMARY
            
            if [[ "${{ needs.publish-to-ghcr.result }}" == "success" ]]; then
              echo "✅ **GHCR Publishing**: Success" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚀 Installation Commands:" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
              echo "# Via Helm repository" >> $GITHUB_STEP_SUMMARY
              echo "helm repo add arda-credit https://ardaglobal.github.io/arda-credit" >> $GITHUB_STEP_SUMMARY
              echo "helm install my-app arda-credit/arda-credit" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "# Via OCI registry" >> $GITHUB_STEP_SUMMARY
              echo "helm install my-app oci://ghcr.io/${{ github.repository_owner }}/helm-charts/arda-credit" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **GHCR Publishing**: Failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️  **No version changes detected** - Skipped release" >> $GITHUB_STEP_SUMMARY
          fi