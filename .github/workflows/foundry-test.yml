name: Foundry Test

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

concurrency:
  # One lane per PR or branch. New runs cancel older ones in that lane.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=large
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          cd contracts
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          cd contracts
          forge test -vvv
        id: test
