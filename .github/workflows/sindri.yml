name: Sindri Zero-Knowledge Circuit CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
jobs:
  lint-compile-deploy:
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    env:
      SINDRI_API_KEY: ${{ secrets.SINDRI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Sindri CLI Tool
        run: |
          npm install -g sindri@latest

      - name: Lint Circuit
        run: |
          sindri lint

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install SP1 toolchain
        shell: bash
        run: |
          echo "Installing SP1 toolchain..."
          curl -L https://sp1.succinct.xyz | bash
          # Set PATH temporarily for this step
          export PATH="$HOME/.sp1/bin:$PATH"
          # Run SP1 update tool
          sp1up
          echo "SP1 toolchain installation completed"

      - name: Build SP1 Program
        run: |
          cd program
          cargo prove build --output-directory ../build

      - name: Get Branch Name
        id: branch-name
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=$HEAD_REF" >> $GITHUB_OUTPUT
            echo "tag=pr-$PR_NUMBER-$HEAD_REF" >> $GITHUB_OUTPUT
          else
            branch=${GITHUB_REF#refs/heads/}
            echo "branch=$branch" >> $GITHUB_OUTPUT
            echo "tag=$branch-$(echo $SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Circuit to Sindri
        run: |
          sindri deploy --tag "${{ steps.branch-name.outputs.tag }}"
