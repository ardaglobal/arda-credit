name: Sindri Circuit CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'program-v*'

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

concurrency:
  # One lane per workflow run
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  circuit-ci-cd:
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    env:
      SINDRI_API_KEY: ${{ secrets.SINDRI_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Detect Component Type
        id: detect
        run: |
          if [[ $GITHUB_REF == refs/tags/program-v* ]]; then
            {
              echo "component=program"
              echo "version=${GITHUB_REF#refs/tags/program-v}"
              echo "circuit_tag=program-${GITHUB_REF#refs/tags/program-v}"
              echo "is_program_release=true"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "component=circuit"
              echo "version=main"
              echo "circuit_tag=main-$(echo $GITHUB_SHA | cut -c1-7)"
              echo "is_program_release=false"
            } >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Sindri CLI Tool
        run: |
          npm install -g sindri@latest

      - name: Lint Circuit
        run: |
          sindri lint

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.rustup/
            ~/.sp1/circuits/plonk/
            ~/.sp1/circuits/groth16/
          key: rust-1.81.0-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: rust-1.81.0-

      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --token "${{ secrets.SP1_PAT }}"
          ~/.sp1/bin/cargo-prove prove --version

      - name: Build SP1 Program
        run: |
          cd program
          ~/.sp1/bin/cargo-prove prove build --output-directory ../build

      - name: Deploy Circuit to Sindri
        run: |
          sindri deploy --tag "${{ steps.detect.outputs.circuit_tag }}"

      - name: Test Circuit
        env:
          SINDRI_CIRCUIT_TAG: ${{ steps.detect.outputs.circuit_tag }}
        run: cargo run --release -- --sindri
