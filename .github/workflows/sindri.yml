name: Sindri Zero-Knowledge Circuit CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

concurrency:
  # One lane per PR or branch. New runs cancel older ones in that lane.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-compile-deploy:
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    env:
      SINDRI_API_KEY: ${{ secrets.SINDRI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Sindri CLI Tool
        run: |
          npm install -g sindri@latest

      - name: Lint Circuit
        run: |
          sindri lint

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.rustup/
            ~/.sp1/circuits/plonk/
            ~/.sp1/circuits/groth16/
          key: rust-1.81.0-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: rust-1.81.0-

      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --token "${{ secrets.SP1_PAT }}"
          ~/.sp1/bin/cargo-prove prove --version

      - name: Build SP1 Program
        run: |
          cd program
          ~/.sp1/bin/cargo-prove prove build --output-directory ../build

      - name: Get Branch Name
        id: branch-name
        env:
          PR_NUMBER: ${{ github.event.number }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "tag=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Circuit to Sindri
        run: |
          sindri deploy --tag "${{ steps.branch-name.outputs.tag }}"

      - name: Test Circuit
        env:
          SINDRI_TAG: ${{ steps.branch-name.outputs.tag }}
        run: cargo run --release -- --sindri
