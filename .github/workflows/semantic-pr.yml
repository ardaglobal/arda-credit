name: Semantic Pull Request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: write

jobs:
  main:
    name: conventional-commit-pr-title
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for semantic-pull-request action
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
