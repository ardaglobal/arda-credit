name: Helm Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
      - 'Makefile'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    paths:
      - 'helm/**'
      - 'Makefile'
      - '.github/workflows/helm-lint.yml'

concurrency:
  # One lane per PR or branch. New runs cancel older ones in that lane.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: Helm Lint
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Add Helm repositories
        run: |
          echo "Adding required Helm repositories..."
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Update Helm dependencies
        run: |
          echo "Updating Helm chart dependencies..."
          cd helm/charts/arda-credit
          helm dependency update

      - name: Lint Helm charts
        run: |
          echo "Running Helm lint on all charts..."
          cd helm/charts
          for chart in */; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting chart: $chart"
              helm lint "$chart" --strict
            fi
          done

      - name: Render Helm templates
        run: |
          echo "Rendering Helm templates..."
          cd helm/charts/arda-credit
          helm template . --dry-run > /dev/null

      - name: Generate Helm lint report on failure
        if: failure()
        run: |
          echo "Helm lint found issues. Generating detailed report..."
          cd helm/charts
          for chart in */; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "=== Lint report for chart: $chart ==="
              helm lint "$chart" --strict || true
              echo ""
            fi
          done
          echo "::warning::Helm lint issues found. See the full report above."
