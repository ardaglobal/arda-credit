name: Helm Lint

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'helm/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'helm/**'

concurrency:
  # One lane per PR or branch. New runs cancel older ones in that lane.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: Helm Lint
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'
        
    - name: Add required Helm repositories
      run: |
        echo "Adding required Helm repositories..."
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo update
        
    - name: Update chart dependencies
      run: |
        echo "Updating Helm chart dependencies..."
        cd helm/charts/arda-credit/
        helm dependency update
        
    - name: Lint Helm chart
      run: |
        echo "Linting Arda Credit Helm chart..."
        helm lint helm/charts/arda-credit/
        
    - name: Validate Helm templates
      run: |
        echo "Validating Helm templates..."
        helm template arda-credit helm/charts/arda-credit/ --debug --dry-run
        
    - name: Generate Helm lint report on failure
      if: failure()
      run: |
        echo "Helm lint found issues. Generating detailed report..."
        echo "::warning::Helm chart validation failed. Please check the logs above for details."
        
    - name: Package Helm chart
      run: |
        echo "Packaging Helm chart to verify it can be built..."
        helm package helm/charts/arda-credit/ --destination /tmp/
        
    - name: Upload Helm chart artifact
      uses: actions/upload-artifact@v4
      with:
        name: arda-credit-helm-chart
        path: /tmp/*.tgz
        retention-days: 7