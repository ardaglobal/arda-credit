name: format
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  format:
    name: format
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo format
        env:
          RUSTUP_TOOLCHAIN: ""  # Clear SP1-specific toolchain to use default
        run: cargo fmt --all -- --check
      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up
          ~/.sp1/bin/cargo-prove prove --version
      - name: Build SP1 program
        env:
          RUSTUP_TOOLCHAIN: ""  # Clear SP1-specific toolchain to use default
        run: |
          cd program
          ~/.sp1/bin/cargo-prove prove build
      - name: Clippy
        env:
          RUSTUP_TOOLCHAIN: ""  # Clear SP1-specific toolchain to use default
        run: |
          cargo clippy \
            --all-targets \
            -- -D warnings \
            -W clippy::pedantic \
            -W clippy::nursery \
            -W clippy::style \
            -W clippy::complexity \
            -W clippy::perf \
            -W clippy::suspicious \
            -W clippy::correctness

  toml-format:
    name: toml-format
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: Install Taplo
        env:
          version: "0.9.3"
        run: |
          curl -Ls "https://github.com/tamasfe/taplo/releases/download/${{ env.version }}/taplo-full-linux-x86_64.gz" | \
          gzip -d > taplo && \
          chmod +x taplo && \
          sudo mv taplo /usr/local/bin/taplo
      - name: Run Taplo
        run: taplo fmt --check
