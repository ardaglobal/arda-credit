name: Multi-Component Release

on:
  push:
    tags:
      - 'contracts-v*-rc*'  # Deploy RC versions
      - 'contracts-v*'      # Skip deployment for final versions
      - 'program-v*'
      - 'v*'

env:
  FOUNDRY_PROFILE: ci

concurrency:
  # One lane per workflow run
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  detect-component:
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    outputs:
      component: ${{ steps.detect.outputs.component }}
      version: ${{ steps.detect.outputs.version }}
      is_rc: ${{ steps.detect.outputs.is_rc }}
    steps:
      - id: detect
        run: |
          if [[ $GITHUB_REF == refs/tags/contracts-v*-rc* ]]; then
            echo "component=contracts" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/contracts-v}" >> $GITHUB_OUTPUT
            echo "is_rc=true" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/tags/contracts-v* ]]; then
            echo "component=contracts" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/contracts-v}" >> $GITHUB_OUTPUT
            echo "is_rc=false" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/tags/program-v* ]]; then
            echo "component=program" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/program-v}" >> $GITHUB_OUTPUT
            echo "is_rc=false" >> $GITHUB_OUTPUT
          else
            echo "component=app" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "is_rc=false" >> $GITHUB_OUTPUT
          fi

  release-contracts-rc:
    if: needs.detect-component.outputs.component == 'contracts' && needs.detect-component.outputs.is_rc == 'true'
    needs: detect-component
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          forge install

      - name: Build contracts
        run: |
          forge build

      - name: Run tests
        run: |
          forge test -vvv

      - name: Deploy to Sepolia
        run: |
          # Deploy contract and capture output
          export SEPOLIA_RPC_URL="${{ secrets.SEPOLIA_RPC_URL }}"
          export PRIVATE_KEY="${{ secrets.ETHEREUM_WALLET_PRIVATE_KEY }}"
          export VERIFIER="${{ secrets.SEPOLIA_GROTH16_VERIFIER }}"
          export PROGRAM_VKEY="${{ secrets.PROGRAM_VKEY }}"
          export ETHERSCAN_KEY="${{ secrets.ETHERSCAN_API_KEY }}"

          DEPLOY_OUTPUT=$(forge create src/Loan.sol:Loan \
            --broadcast \
            --rpc-url "$SEPOLIA_RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --constructor-args "$VERIFIER" "$PROGRAM_VKEY" \
            --verify \
            --verifier etherscan \
            --etherscan-api-key "$ETHERSCAN_KEY")

          echo "Deploy output:"
          echo "$DEPLOY_OUTPUT"

          # Extract contract address and transaction hash
          CONTRACT_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep "Deployed to:" | cut -d' ' -f3)
          TX_HASH=$(echo "$DEPLOY_OUTPUT" | grep "Transaction hash:" | cut -d' ' -f3)

          if [ -z "$CONTRACT_ADDRESS" ]; then
            echo "Failed to extract contract address"
            exit 1
          fi

          echo "Contract deployed to: $CONTRACT_ADDRESS"
          echo "Transaction hash: $TX_HASH"

          # Create deployment record
          mkdir -p deployments
          cat > deployments/contracts-${GITHUB_REF#refs/tags/}.json << EOF
          {
            "contractAddress": "$CONTRACT_ADDRESS",
            "deploymentTx": "$TX_HASH",
            "blockNumber": "$(cast block-number --rpc-url ${{ secrets.SEPOLIA_RPC_URL }})",
            "network": "sepolia",
            "timestamp": "$(date -Iseconds)",
            "tag": "${GITHUB_REF#refs/tags/}",
            "commit": "$GITHUB_SHA",
            "verifier": "${{ secrets.SEPOLIA_GROTH16_VERIFIER }}",
            "programVKey": "${{ secrets.PROGRAM_VKEY }}"
          }
          EOF

          # Export for use in subsequent steps
          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> $GITHUB_ENV
          echo "TX_HASH=$TX_HASH" >> $GITHUB_ENV

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          # Wait a bit for Etherscan verification
          sleep 30

          # Check if contract is verified on Etherscan
          export ETHERSCAN_KEY="${{ secrets.ETHERSCAN_API_KEY }}"
          VERIFICATION_STATUS=$(curl -s "https://api-sepolia.etherscan.io/api?module=contract&action=getabi&address=$CONTRACT_ADDRESS&apikey=$ETHERSCAN_KEY" | jq -r '.status')

          if [ "$VERIFICATION_STATUS" = "1" ]; then
            echo "✅ Contract verified on Etherscan"
          else
            echo "⚠️  Contract verification pending on Etherscan"
          fi

      - name: Commit deployment record
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployments/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add deployment record for ${GITHUB_REF#refs/tags/}

          Contract: $CONTRACT_ADDRESS
          Transaction: $TX_HASH
          Network: Sepolia"

            # Push the deployment record
            git push
          fi

      - name: Create deployment summary
        run: |
          echo "## 🚀 Contract Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "**Contract Address:** \`$CONTRACT_ADDRESS\`" >> $GITHUB_STEP_SUMMARY
          echo "**Transaction:** \`$TX_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** Sepolia" >> $GITHUB_STEP_SUMMARY
          echo "**Block:** $(cast block-number --rpc-url ${{ secrets.SEPOLIA_RPC_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$GITHUB_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Test the deployed contract" >> $GITHUB_STEP_SUMMARY
          echo "2. If successful, create final version tag: \`git tag contracts-${GITHUB_REF#refs/tags/contracts-v}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Push final tag: \`git push origin contracts-${GITHUB_REF#refs/tags/contracts-v}\`" >> $GITHUB_STEP_SUMMARY

  release-program:
    if: needs.detect-component.outputs.component == 'program'
    needs: detect-component
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build and test program
        run: |
          echo "Building program..."
          cd program
          cargo build --release

      - name: Generate verification key
        run: |
          echo "Generating verification key..."
          cd script
          cargo run --release -- --vkey

      - name: Create program summary
        run: |
          echo "## 🔧 Program Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Built and tested" >> $GITHUB_STEP_SUMMARY

  release-app:
    if: needs.detect-component.outputs.component == 'app'
    needs: detect-component
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t ghcr.io/ardaglobal/arda-credit:${GITHUB_REF#refs/tags/v} .

      - name: Push Docker image
        run: |
          echo "Pushing Docker image..."
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/ardaglobal/arda-credit:${GITHUB_REF#refs/tags/v}

      - name: Create app summary
        run: |
          echo "## 📦 Application Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** \`ghcr.io/ardaglobal/arda-credit:${GITHUB_REF#refs/tags/v}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Built and pushed" >> $GITHUB_STEP_SUMMARY
