name: Deploy Smart Contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'contracts-v*-rc*'
      - 'contracts-v*'
    paths:
      - "contracts/**"

env:
  FOUNDRY_PROFILE: ci

concurrency:
  # One lane per workflow run
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  detect-component:
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    outputs:
      component: ${{ steps.detect.outputs.component }}
      version: ${{ steps.detect.outputs.version }}
      is_rc: ${{ steps.detect.outputs.is_rc }}
    steps:
      - id: detect
        run: |
          if [[ $GITHUB_REF == refs/tags/contracts-v*-rc* ]]; then
            {
              echo "component=contracts"
              echo "version=${GITHUB_REF#refs/tags/contracts-v}"
              echo "is_rc=true"
            } >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/tags/contracts-v* ]]; then
            {
              echo "component=contracts"
              echo "version=${GITHUB_REF#refs/tags/contracts-v}"
              echo "is_rc=false"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "component=contracts"
              echo "version=main"
              echo "is_rc=false"
            } >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy Contracts
    needs: detect-component
    if: needs.detect-component.outputs.component == 'contracts'
    runs-on:
      - codebuild-arda-credit-${{ github.run_id }}-${{ github.run_attempt }}
      - image=ubuntu-7.0
      - instance-size=small
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          forge install

      - name: Build contracts
        run: |
          forge build

      - name: Run tests
        run: |
          forge test -vvv

      - name: Deploy contract
        run: |
          # Deploy contract and capture output
          export SEPOLIA_RPC_URL="${{ secrets.SEPOLIA_RPC_URL }}"
          export PRIVATE_KEY="${{ secrets.ETHEREUM_WALLET_PRIVATE_KEY }}"
          export VERIFIER="${{ secrets.SEPOLIA_GROTH16_VERIFIER }}"
          export PROGRAM_VKEY="${{ secrets.PROGRAM_VKEY }}"
          export ETHERSCAN_KEY="${{ secrets.ETHERSCAN_API_KEY }}"

          DEPLOY_OUTPUT=$(forge create src/Loan.sol:Loan \
            --broadcast \
            --rpc-url "$SEPOLIA_RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --constructor-args "$VERIFIER" "$PROGRAM_VKEY" \
            --verify \
            --verifier etherscan \
            --etherscan-api-key "$ETHERSCAN_KEY")

          echo "Deploy output:"
          echo "$DEPLOY_OUTPUT"

          # Extract contract address and transaction hash
          CONTRACT_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep "Deployed to:" | cut -d' ' -f3)
          TX_HASH=$(echo "$DEPLOY_OUTPUT" | grep "Transaction hash:" | cut -d' ' -f3)

          if [ -z "$CONTRACT_ADDRESS" ]; then
            echo "Failed to extract contract address"
            exit 1
          fi

          echo "Contract deployed to: $CONTRACT_ADDRESS"
          echo "Transaction hash: $TX_HASH"

          # Export for use in subsequent steps
          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> $GITHUB_ENV
          echo "TX_HASH=$TX_HASH" >> $GITHUB_ENV

      - name: Create deployment record
        run: |
          # Create deployment record
          mkdir -p deployments
          cat > deployments/${{ needs.detect-component.outputs.version }}.json << EOF
          {
            "contractAddress": "$CONTRACT_ADDRESS",
            "deploymentTx": "$TX_HASH",
            "blockNumber": "$(cast block-number --rpc-url ${{ secrets.SEPOLIA_RPC_URL }})",
            "network": "sepolia",
            "timestamp": "$(date -Iseconds)",
            "tag": "${GITHUB_REF#refs/tags/}",
            "commit": "$GITHUB_SHA",
            "verifier": "${{ secrets.SEPOLIA_GROTH16_VERIFIER }}",
            "programVKey": "${{ secrets.PROGRAM_VKEY }}"
          }
          EOF

      - name: Create Pull Request with deployment record
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Add deployment record for ${GITHUB_REF#refs/tags/}

            Contract: ${{ env.CONTRACT_ADDRESS }}
            Transaction: ${{ env.TX_HASH }}
            Network: Sepolia
          title: "Deploy contract ${{ env.CONTRACT_ADDRESS }} (${{ needs.detect-component.outputs.version }})"
          body: |
            ## 🚀 Contract Deployment

            **Tag:** ${GITHUB_REF#refs/tags/}
            **Contract Address:** `${{ env.CONTRACT_ADDRESS }}`
            **Transaction:** `${{ env.TX_HASH }}`
            **Network:** Sepolia
            **Commit:** `${GITHUB_SHA}`

            ### Files Changed:
            - `contracts/deployments/${{ needs.detect-component.outputs.version }}.json` - Deployment record

            ### Next Steps:
            1. Review the deployment record
            2. Test the deployed contract if needed
            3. Merge this PR to add the deployment record to the repository
          branch: deploy/${{ needs.detect-component.outputs.version }}
          delete-branch: true
          draft: false

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          # Wait a bit for Etherscan verification
          sleep 30

          # Check if contract is verified on Etherscan
          export ETHERSCAN_KEY="${{ secrets.ETHERSCAN_API_KEY }}"
          VERIFICATION_STATUS=$(curl -s "https://api-sepolia.etherscan.io/api?module=contract&action=getabi&address=$CONTRACT_ADDRESS&apikey=$ETHERSCAN_KEY" | jq -r '.status')

          if [ "$VERIFICATION_STATUS" = "1" ]; then
            echo "✅ Contract verified on Etherscan"
          else
            echo "⚠️  Contract verification pending on Etherscan"
          fi

      - name: Create deployment summary
        run: |
          {
            echo "## 🚀 Contract Deployment Summary"
            echo ""
            echo "**Tag:** ${GITHUB_REF#refs/tags/}"
            echo "**Contract Address:** \`$CONTRACT_ADDRESS\`"
            echo "**Transaction:** \`$TX_HASH\`"
            echo "**Network:** Sepolia"
            echo "**Block:** $(cast block-number --rpc-url ${{ secrets.SEPOLIA_RPC_URL }})"
            echo "**Commit:** \`$GITHUB_SHA\`"
            echo ""
            echo "### Next Steps:"
            echo "1. Test the deployed contract"
            if [[ $GITHUB_REF == refs/tags/contracts-v*-rc* ]]; then
              echo "2. If successful, create final version tag: \`git tag contracts-${GITHUB_REF#refs/tags/contracts-v}\`"
              echo "3. Push final tag: \`git push origin contracts-${GITHUB_REF#refs/tags/contracts-v}\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
