# Kubernetes deployment configuration for Arda Credit Document Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: document-service-config
  namespace: arda-credit
data:
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "arda-credit-documents"
  DOCUMENT_MAX_FILE_SIZE_MB: "100"
  DOCUMENT_STORAGE_LIFECYCLE_DAYS_IA: "30"
  DOCUMENT_STORAGE_LIFECYCLE_DAYS_GLACIER: "90"
  DOCUMENT_STORAGE_LIFECYCLE_DAYS_DELETE: "2555"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  METRICS_ENABLED: "true"
  PROMETHEUS_ENDPOINT: "/metrics"
  LOG_LEVEL: "info"
  RUST_LOG: "arda_credit=info,document_service=debug"

---
apiVersion: v1
kind: Secret
metadata:
  name: document-service-secrets
  namespace: arda-credit
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  database-url: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0Bob3N0OjU0MzIvYXJkYV9jcmVkaXQ=
  jwt-secret: eW91ci1qd3Qtc2VjcmV0LWtleQ==
  aws-kms-key-id: YXJuOmF3czprbXM6dXMtZWFzdC0xOmFjY291bnQ6a2V5L2tleS1pZA==

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: arda-credit
  labels:
    app: document-service
    component: api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
        component: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: document-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: document-service
        image: arda-credit/document-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: document-service-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: document-service-secrets
              key: jwt-secret
        - name: AWS_KMS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: document-service-secrets
              key: aws-kms-key-id
        envFrom:
        - configMapRef:
            name: document-service-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
        livenessProbe:
          httpGet:
            path: /api/documents/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/documents/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/documents/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - document-service
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300

---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: arda-credit
  labels:
    app: document-service
    component: api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: document-service

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-service
  namespace: arda-credit
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/arda-credit-document-service-role

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: document-service-ingress
  namespace: arda-credit
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.arda-credit.com
    secretName: document-service-tls
  rules:
  - host: api.arda-credit.com
    http:
      paths:
      - path: /api/companies
        pathType: Prefix
        backend:
          service:
            name: document-service
            port:
              number: 80
      - path: /api/documents
        pathType: Prefix
        backend:
          service:
            name: document-service
            port:
              number: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: document-service-pdb
  namespace: arda-credit
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: document-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: document-service-hpa
  namespace: arda-credit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: document-service-metrics
  namespace: arda-credit
  labels:
    app: document-service
spec:
  selector:
    matchLabels:
      app: document-service
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    honorLabels: true

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: document-service-network-policy
  namespace: arda-credit
spec:
  podSelector:
    matchLabels:
      app: document-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 443   # HTTPS (AWS S3, KMS)
    - protocol: TCP
      port: 53    # DNS
    - protocol: UDP
      port: 53    # DNS