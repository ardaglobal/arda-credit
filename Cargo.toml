[workspace]
members = [
    "api",
    "db",
    "ethereum-client",
    "lib",
    "program",
    "script",
    "scripts",
    "scripts/create-user-magic-link",
]
resolver = "2"

[workspace.dependencies]
alloy-consensus      = "1.5"
alloy-contract       = "1.2"
alloy-dyn-abi        = "1.5.2"                                                                                      # Security fix for RUSTSEC-2025-0073
alloy-json-rpc       = "1.5"
alloy-network        = "1.5"
alloy-primitives     = "1.4.0"
alloy-provider       = "1.5.2"
alloy-rpc-types      = "1.5"
alloy-rpc-types-eth  = "1.0"
alloy-signer         = "1.0"
alloy-signer-local   = "1.5"
alloy-sol-types      = "1.0"
alloy-transport      = "1.0"
alloy-transport-http = "1.0"
anyhow               = "1.0"
axum                 = "0.8.8"
bincode              = "2.0.1"
chrono               = "0.4"
clap                 = "4.5.54"
dotenv               = "0.15.0"
eyre                 = "0.6"
futures              = "0.3"
hex                  = "0.4.3"
once_cell            = "1.20"
parking_lot          = "0.12.5"
reqwest              = "0.12"
rust_decimal         = "1.40"
serde                = { version = "1.0.228", default-features = false, features = [ "derive" ] }
serde_json           = { version = "1.0.149", default-features = false, features = [ "alloc" ] }
sha2                 = "0.10"
sindri               = "0.3.1"
sp1-build            = "5.2.4"
sp1-sdk              = "5.2.4"
sp1-zkvm             = "5.2.4"
sqlx                 = { version = "0.8.6", features = [ "ipnetwork", "postgres", "runtime-tokio", "tls-rustls" ] }
termion              = "4.0"
thiserror            = "2.0.18"
tokio                = { version = "1.49.0", features = [ "full" ] }
tracing              = "0.1.44"
tracing-subscriber   = ">=0.3.20"
url                  = "2.5.8"
uuid                 = "1.20"

# Prometheus metrics dependencies
axum-prometheus             = "0.9"
metrics                     = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-util                = "0.20"
prometheus                  = "0.14.0"
rayon                       = "1.10"

# AWS S3 and document storage dependencies
aws-config  = "1.8"
aws-sdk-kms = "1.91"
aws-sdk-s3  = "1.109"
mime        = "0.3"
mime_guess  = "2.0"
validator   = "0.20"

# Poseidon hash dependencies (for ZK-friendly Merkle trees)
# Using succinct versions to match SP1 zkVM dependencies
p3-baby-bear = "0.4.2"
p3-field     = "0.4.1"
p3-poseidon2 = "0.4.1"
p3-symmetric = "0.4.1"
