global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Arda Credit API Server
  - job_name: "arda-credit-api"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 5s

  # Arda Credit Ethereum Client (if running separately)
  - job_name: "arda-credit-ethereum-client"
    static_configs:
      - targets: ["host.docker.internal:8081"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL Exporter (optional - for database metrics)
  - job_name: "postgres"
    static_configs:
      - targets: ["host.docker.internal:9187"]
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s