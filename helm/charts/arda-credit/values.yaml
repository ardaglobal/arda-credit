# Default values for arda-credit
# This is a YAML-formatted file.

global:
  imagePullSecrets:
    - name: ghcr-secret
  # Global node selectors applied to all components by default
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Namespace creation (handled by deployment script)
# namespaceCreate: true

# PostgreSQL configuration
# Can use either bundled PostgreSQL (enabled: true) or external instance (enabled: false)
postgresql:
  # Enable bundled PostgreSQL
  enabled: true
  
  # Override global registry for PostgreSQL to use public Bitnami registry
  global:
    imageRegistry: ""
    imagePullSecrets: []
  
  image:
    registry: docker.io
    repository: bitnami/postgresql
  
  # Configuration for bundled PostgreSQL
  auth:
    database: "arda_credit_db"
    username: "postgres"
    password: "change-me-in-production"
  
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "gp2"
      annotations:
        "helm.sh/resource-policy": "keep"

    # Initialize monitoring user for SigNoz integration
    initdb:
      scripts:
        01-create-monitoring-user.sql: |
          -- Create monitoring user with proper permissions for SigNoz PostgreSQL monitoring
          -- This script runs during PostgreSQL initialization and survives pod restarts
          
          DO $$
          BEGIN
              -- Create monitoring user (ignore error if already exists)
              BEGIN
                  CREATE USER monitoring WITH PASSWORD 'monitoring-password';
                  RAISE NOTICE 'Created monitoring user';
              EXCEPTION WHEN duplicate_object THEN
                  RAISE NOTICE 'Monitoring user already exists, updating password';
                  ALTER USER monitoring PASSWORD 'monitoring-password';
              END;
          END
          $$;
          
          -- Grant required permissions for PostgreSQL 10+ (per SigNoz documentation)
          GRANT pg_monitor TO monitoring;
          GRANT SELECT ON pg_stat_database TO monitoring;
          
          -- Log successful setup
          \echo 'Monitoring user configured successfully for SigNoz integration'
    
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    
    # Node placement configuration for PostgreSQL primary
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # External PostgreSQL configuration (when enabled: false)
  external:
    host: "external-postgresql"
    port: 5432
    database: "arda_credit_db"
    username: "postgres"
    existingSecret: "external-postgres-secret"
    secretPasswordKey: "password"

# API Server configuration
server:
  enabled: true
  
  image:
    registry: ghcr.io/ardaglobal
    repository: arda-credit
    tag: "latest"
    pullPolicy: Always
  
  replicaCount: 1
  
  # OpenTelemetry configuration (dynamic service discovery)
  opentelemetry:
    enabled: true
    serviceName: "arda-credit-api"
    # OTEL collector endpoint will be templated dynamically
  
  # Configuration for ConfigMap (non-sensitive)
  config:
    rustLog: "debug"
    serverPort: "8080"
    sindriCircuitTag: "latest"
  
  # Persistence configuration for server data
  persistence:
    enabled: true
    size: 2Gi
    storageClass: "gp2"
    accessMode: ReadWriteOnce
    mountPath: /app/data
    annotations:
      "helm.sh/resource-policy": "keep"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
  
  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 15
  
  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  
  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 50%
  
  # Pod Anti-Affinity - spreads pods across nodes
  podAntiAffinity:
    enabled: true
    type: "soft"  # "soft" or "hard"
    topologyKey: "kubernetes.io/hostname"
    weight: 100
  
  # Node placement configuration
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Frontend App configuration
app:
  enabled: true
  
  image:
    registry: ghcr.io/ardaglobal
    repository: arda-credit-app
    tag: "latest"
    pullPolicy: Always
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  
  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 50%
  
  # Pod Anti-Affinity - spreads pods across nodes
  podAntiAffinity:
    enabled: true
    type: "soft"  # "soft" or "hard"
    topologyKey: "kubernetes.io/hostname"
    weight: 100
  
  # Node placement configuration
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ingress configuration
ingress:
  enabled: true
  className: "alb"  # Using ALB ingress that was working before
  
  annotations:
    # ALB ingress annotations (matching working SigNoz pattern)
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/load-balancer-name: arda-credit-alb
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:788391084262:certificate/4b588a3b-134e-49dc-9a2d-79d96427ead1
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    
    # External DNS for automatic Route53 management
    external-dns.alpha.kubernetes.io/hostname: app.stag.aws.arda.xyz
  
  hosts:
    - host: app.stag.aws.arda.xyz
      paths:
        - path: /api
          pathType: Prefix
          service:
            name: server
            port: 8080
        - path: /
          pathType: Prefix
          service:
            name: app
            port: 80
  
  tls:
    - secretName: arda-credit-tls
      hosts:
        - app.stag.aws.arda.xyz

# Application secrets - supports both external secrets (.env) and direct values
secrets:
  # For production: use external secret created from .env
  existingSecret: "arda-credit-secrets-external"  # Points to secret created from .env
  
  # Fallback values (used when no external secret)
  app:
    sindriApiKey: "your-sindri-api-key"
    ethereumRpcUrl: "https://eth-mainnet.alchemyapi.io/v2/demo"
    ethereumContractAddress: "0x..."
    ethereumWalletPrivateKey: "0x..."
    ethereumDeployerAddress: "0x..."
    signozIngestionKey: "your-signoz-ingestion-key"

# Security Context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

# App-specific security contexts (permissive for nginx)
appPodSecurityContext: {}

appSecurityContext: {}

# Service Account and RBAC
serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # Automatically mount a ServiceAccount's API credentials
  automount: false

rbac:
  # Specifies whether RBAC resources should be created
  create: true

# Monitoring configuration
monitoring:
  # PostgreSQL Prometheus Exporter configuration
  postgresExporter:
    enabled: true
    
    # Configuration for the prometheus-postgres-exporter subchart
    config:
      # Data source configuration
      datasource:
        # Connection details - these will be templated to match PostgreSQL config
        host: ""  # Will be templated from postgresql configuration
        port: 5432
        database: ""  # Will be templated from postgresql.auth.database
        username: ""  # Will be templated from postgresql.auth.username
        # Password will be sourced from the same secret as PostgreSQL
        passwordSecret:
          name: ""  # Will be templated to match PostgreSQL secret
          key: "password"
        sslmode: "disable"  # For internal cluster communication
        
      # Custom queries and collectors
      collectors:
        - "pg_stat_database"
        - "pg_stat_bgwriter"
        - "pg_stat_user_tables"
        - "pg_locks"
        - "pg_stat_replication"
        - "arda_credit_metrics"  # Custom collector for loan transaction metrics
      
      # Custom queries for Arda Credit specific metrics
      customQueries: |
        arda_credit_metrics:
          query: |
            SELECT 
              'loan_transactions_total' as metric,
              COUNT(*) as value,
              transaction_type as transaction_type
            FROM loan_transactions 
            GROUP BY transaction_type
            UNION ALL
            SELECT 
              'batch_processing_total' as metric,
              COUNT(*) as value,
              'all' as transaction_type
            FROM proof_batches
            UNION ALL
            SELECT
              'user_balances_total' as metric,
              COUNT(*) as value,
              'all' as transaction_type
            FROM user_balances
          metrics:
            - metric: "arda_credit_loan_transactions_total"
              description: "Total number of loan transactions by type"
              usage: "COUNTER"
              labels:
                - "transaction_type"
            - metric: "arda_credit_batch_processing_total" 
              description: "Total number of processed batches"
              usage: "COUNTER"
            - metric: "arda_credit_user_balances_total"
              description: "Total number of user balance records"
              usage: "GAUGE"
    
    # Service configuration  
    service:
      type: ClusterIP
      port: 9187
      targetPort: 9187
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    
    # Resource limits
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    
    # Service monitor for Prometheus operator
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

  # OpenTelemetry Collector configuration
  otelCollector:
    enabled: true
    
    # Configuration for collecting metrics from multiple sources
    config:
      # Environment variables for SigNoz integration
      env:
        # PostgreSQL connection details
        POSTGRESQL_ENDPOINT: ""  # Will be templated from postgresql configuration
        POSTGRESQL_USERNAME: ""  # Will be templated from postgresql.auth.username  
        POSTGRESQL_PASSWORD: ""  # Will be templated from postgresql.auth.password
        # SigNoz Cloud configuration
        OTLP_DESTINATION_ENDPOINT: "ingest.us.signoz.cloud:443"
        SIGNOZ_INGESTION_KEY: ""  # Must be provided via secrets
      
      # Collection pipelines configuration
      receivers:
        # Direct PostgreSQL metrics collection
        postgresql:
          endpoint: "${env:POSTGRESQL_ENDPOINT}"
          collection_interval: 60s
          username: "${env:POSTGRESQL_USERNAME}"
          password: "${env:POSTGRESQL_PASSWORD}"
          databases: []  # Collect from all non-template databases
          tls:
            insecure: true
          metrics:
            postgresql.database.locks:
              enabled: true
            postgresql.deadlocks:
              enabled: true
            postgresql.sequential_scans:
              enabled: true
        
        # Scrape metrics from prometheus-postgres-exporter
        prometheus/postgres-exporter:
          config:
            scrape_configs:
              - job_name: 'postgres-exporter'
                static_configs:
                  - targets: ['arda-credit-prometheus-postgres-exporter:9187']
                scrape_interval: 30s
                metrics_path: /metrics
      
      processors:
        # Enrich data with host information
        resourcedetection/system:
          detectors: ["system"]
          system:
            hostname_sources: ["os"]
        
        # Add resource attributes for better identification
        resource:
          attributes:
            - key: service.name
              value: "arda-credit-postgres"
              action: upsert
            - key: deployment.environment
              value: "development"
              action: upsert
      
      exporters:
        # Export to SigNoz Cloud (PostgreSQL metrics)
        otlp/signoz:
          endpoint: "${env:OTLP_DESTINATION_ENDPOINT}"
          tls:
            insecure: false
          headers:
            "signoz-ingestion-key": "${env:SIGNOZ_INGESTION_KEY}"
        
        # Export to SigNoz Cloud (Arda Credit traces)
        otlp/arda-credit:
          endpoint: "${env:OTLP_DESTINATION_ENDPOINT}"
          tls:
            insecure: false
          headers:
            "signoz-ingestion-key": "${env:SIGNOZ_INGESTION_KEY}"
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 300s
          sending_queue:
            enabled: true
            queue_size: 5000
            num_consumers: 10
        
        # Debug exporter for local testing
        debug:
          verbosity: detailed
      
      service:
        pipelines:
          # PostgreSQL metrics pipeline
          metrics/postgresql:
            receivers: [postgresql, prometheus/postgres-exporter]
            processors: [resourcedetection/system, resource]
            exporters: [otlp/signoz]
          
          # Arda Credit traces pipeline
          traces/arda-credit:
            receivers: [otlp, jaeger, zipkin]
            processors: [memory_limiter, batch]
            exporters: [otlp/arda-credit, debug]
          
          # Debug pipeline for local development
          metrics/debug:
            receivers: [postgresql, prometheus/postgres-exporter]  
            processors: [resourcedetection/system, resource]
            exporters: [debug]
    
    # Service configuration
    service:
      type: ClusterIP
      ports:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
        - name: otlp-http  
          port: 4318
          targetPort: 4318
    
    # Resource limits
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi

# Component-specific node selectors are defined within each component section above

# EKS Storage Configuration - PVC Retention
storage:
  createStorageClass: false  # Storage class already exists

# Direct configuration for prometheus-postgres-exporter subchart
prometheus-postgres-exporter:
  config:
    datasource:
      host: arda-credit-postgresql
      user: postgres
      password: change-me-in-production
      port: "5432"
      database: arda_credit_db
      sslmode: disable
  
  service:
    type: ClusterIP
    port: 9187
    targetPort: 9187
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Direct configuration for opentelemetry-collector subchart  
opentelemetry-collector:
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.134.1"
  
  mode: "deployment"
  
  # Environment variables with dynamic service discovery
  extraEnvs:
    - name: POSTGRESQL_ENDPOINT
      value: "arda-credit-postgresql:5432"
    - name: POSTGRESQL_USERNAME
      value: "postgres"
    - name: POSTGRESQL_PASSWORD
      value: "change-me-in-production"
    - name: POSTGRESQL_DATABASE
      value: "arda_credit_db"
    - name: OTLP_DESTINATION_ENDPOINT
      value: "ingest.us.signoz.cloud:443"
    - name: SIGNOZ_INGESTION_KEY
      valueFrom:
        secretKeyRef:
          name: arda-credit-secrets
          key: signoz-ingestion-key

  config:
    receivers:
      postgresql:
        endpoint: "${env:POSTGRESQL_ENDPOINT}"
        collection_interval: 60s
        username: "${env:POSTGRESQL_USERNAME}"
        password: "${env:POSTGRESQL_PASSWORD}"
        databases: ["${env:POSTGRESQL_DATABASE}"]
        tls:
          insecure: true
        metrics:
          postgresql.database.locks:
            enabled: true
          postgresql.deadlocks:
            enabled: true
          postgresql.sequential_scans:
            enabled: true
          postgresql.database.count:
            enabled: true
          postgresql.backends:
            enabled: true
          postgresql.connection.max:
            enabled: true
          postgresql.blocks_read:
            enabled: true
      
      prometheus/postgres-exporter:
        config:
          scrape_configs:
            - job_name: 'postgres-exporter'
              static_configs:
                - targets: ['arda-credit-prometheus-postgres-exporter:9187']
              scrape_interval: 30s
              metrics_path: /metrics

    processors:
      resourcedetection/system:
        detectors: ["system"]
        system:
          hostname_sources: ["os"]
      
      memory_limiter:
        limit_mib: 400
        spike_limit_mib: 100
        check_interval: 5s
      
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      otlp/signoz:
        endpoint: "${env:OTLP_DESTINATION_ENDPOINT}"
        tls:
          insecure: false
        headers:
          "signoz-ingestion-key": "${env:SIGNOZ_INGESTION_KEY}"
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
      
      debug:
        verbosity: detailed

    service:
      telemetry:
        logs:
          level: "info"
      pipelines:
        metrics/postgresql:
          receivers: [postgresql]
          processors: [resourcedetection/system]
          exporters: [otlp/signoz, debug]
        
        metrics/postgres-exporter:
          receivers: [prometheus/postgres-exporter]
          processors: [resourcedetection/system]
          exporters: [otlp/signoz, debug]
        
        traces/arda-credit:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, batch]
          exporters: [otlp/signoz, debug]

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
