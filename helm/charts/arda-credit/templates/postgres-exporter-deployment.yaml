{{- if .Values.postgresql.exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arda-credit.fullname" . }}-postgres-exporter
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arda-credit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "arda-credit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-exporter
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arda-credit.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres-exporter
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.postgresql.exporter.image.registry }}/{{ .Values.postgresql.exporter.image.repository }}:{{ .Values.postgresql.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.exporter.image.pullPolicy }}
          ports:
            - name: http-metrics
              containerPort: 9187
              protocol: TCP
          env:
            # PostgreSQL connection configuration
            - name: DATA_SOURCE_NAME
              {{- if .Values.postgresql.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "arda-credit.fullname" . }}-postgres-exporter
                  key: datasource
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.external.existingSecret }}
                  key: {{ .Values.postgresql.external.secretPasswordKey }}
              {{- end }}
            # Configuration options
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: "/etc/postgres_exporter/queries.yaml"
            - name: PG_EXPORTER_DISABLE_DEFAULT_METRICS
              value: "{{ .Values.postgresql.exporter.disableDefaultMetrics | default false }}"
            - name: PG_EXPORTER_DISABLE_SETTINGS_METRICS
              value: "{{ .Values.postgresql.exporter.disableSettingsMetrics | default false }}"
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "{{ .Values.postgresql.exporter.autoDiscoverDatabases | default true }}"
            - name: PG_EXPORTER_EXCLUDE_DATABASES
              value: "{{ .Values.postgresql.exporter.excludeDatabases | default "template0,template1" }}"
          volumeMounts:
            - name: queries-config
              mountPath: /etc/postgres_exporter
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgresql.exporter.resources | nindent 12 }}
      volumes:
        - name: queries-config
          configMap:
            name: {{ include "arda-credit.fullname" . }}-postgres-exporter-queries
      {{- with .Values.postgresql.exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.exporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.exporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}