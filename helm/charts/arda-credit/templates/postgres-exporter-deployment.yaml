{{- if and .Values.postgresql.enabled .Values.postgresql.metrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arda-credit.fullname" . }}-postgres-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arda-credit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      labels:
        {{- include "arda-credit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-exporter
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arda-credit.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres-exporter
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.postgresql.metrics.image.registry }}/{{ .Values.postgresql.metrics.image.repository }}:{{ .Values.postgresql.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.metrics.image.pullPolicy }}
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "arda-credit.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "arda-credit.fullname" . }}-postgresql
                  key: postgres-password
          ports:
            - name: http-metrics
              containerPort: {{ .Values.postgresql.metrics.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.metrics.resources | nindent 12 }}
      {{- with .Values.postgresql.metrics.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.metrics.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.metrics.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}