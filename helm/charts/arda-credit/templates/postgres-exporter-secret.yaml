{{- if and .Values.postgresql.exporter.enabled .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arda-credit.fullname" . }}-postgres-exporter
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
type: Opaque
stringData:
  # Datasource URL for postgres-exporter
  datasource: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "arda-credit.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
{{- end }}