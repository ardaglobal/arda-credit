apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "arda-credit.fullname" . }}
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "arda-credit.fullname" . }}
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
rules:
  # Minimal permissions - adjust based on actual needs
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "arda-credit.fullname" . }}
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "arda-credit.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "arda-credit.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}