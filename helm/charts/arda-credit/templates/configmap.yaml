apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arda-credit.fullname" . }}-config
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
data:
  # Server configuration
  RUST_LOG: {{ .Values.server.config.rustLog | quote }}
  SERVER_PORT: {{ .Values.server.config.serverPort | quote }}
  SINDRI_CIRCUIT_TAG: {{ .Values.server.config.sindriCircuitTag | quote }}
  
  # App configuration  
  SERVER_URL: "http://{{ include "arda-credit.fullname" . }}-server:{{ .Values.server.service.port }}"
  
  # Database configuration (non-sensitive)
  {{- if .Values.postgresql.enabled }}
  POSTGRES_HOST: "{{ include "arda-credit.fullname" . }}-postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  {{- else }}
  POSTGRES_HOST: {{ .Values.postgresql.external.host | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.external.port | quote }}
  POSTGRES_DB: {{ .Values.postgresql.external.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.external.username | quote }}
  {{- end }}