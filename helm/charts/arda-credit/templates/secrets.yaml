apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arda-credit.fullname" . }}-secrets
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.existingSecret }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.secrets.existingSecret }}
  {{- if and $existingSecret $existingSecret.data }}
  # Use values from existing external secret created by setup script
  {{- if index $existingSecret.data "sindri-api-key" }}
  sindri-api-key: {{ index $existingSecret.data "sindri-api-key" }}
  {{- else }}
  sindri-api-key: {{ .Values.secrets.app.sindriApiKey | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "ethereum-rpc-url" }}
  ethereum-rpc-url: {{ index $existingSecret.data "ethereum-rpc-url" }}
  {{- else }}
  ethereum-rpc-url: {{ .Values.secrets.app.ethereumRpcUrl | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "ethereum-contract-address" }}
  ethereum-contract-address: {{ index $existingSecret.data "ethereum-contract-address" }}
  {{- else }}
  ethereum-contract-address: {{ .Values.secrets.app.ethereumContractAddress | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "ethereum-wallet-private-key" }}
  ethereum-wallet-private-key: {{ index $existingSecret.data "ethereum-wallet-private-key" }}
  {{- else }}
  ethereum-wallet-private-key: {{ .Values.secrets.app.ethereumWalletPrivateKey | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "ethereum-deployer-address" }}
  ethereum-deployer-address: {{ index $existingSecret.data "ethereum-deployer-address" }}
  {{- else }}
  ethereum-deployer-address: {{ .Values.secrets.app.ethereumDeployerAddress | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "signoz-ingestion-key" }}
  signoz-ingestion-key: {{ index $existingSecret.data "signoz-ingestion-key" }}
  {{- else }}
  signoz-ingestion-key: {{ .Values.secrets.app.signozIngestionKey | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "aws-access-key-id" }}
  aws-access-key-id: {{ index $existingSecret.data "aws-access-key-id" }}
  {{- else }}
  aws-access-key-id: {{ .Values.secrets.app.awsAccessKeyId | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "aws-secret-access-key" }}
  aws-secret-access-key: {{ index $existingSecret.data "aws-secret-access-key" }}
  {{- else }}
  aws-secret-access-key: {{ .Values.secrets.app.awsSecretAccessKey | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "email-from" }}
  email-from: {{ index $existingSecret.data "email-from" }}
  {{- else }}
  email-from: {{ .Values.secrets.app.emailFrom | b64enc | quote }}
  {{- end }}
  {{- if index $existingSecret.data "email-reply-to" }}
  email-reply-to: {{ index $existingSecret.data "email-reply-to" }}
  {{- else }}
  email-reply-to: {{ .Values.secrets.app.emailReplyTo | b64enc | quote }}
  {{- end }}
  {{- else }}
  # Fallback when existing secret not found - use chart values
  sindri-api-key: {{ .Values.secrets.app.sindriApiKey | b64enc | quote }}
  ethereum-rpc-url: {{ .Values.secrets.app.ethereumRpcUrl | b64enc | quote }}
  ethereum-contract-address: {{ .Values.secrets.app.ethereumContractAddress | b64enc | quote }}
  ethereum-wallet-private-key: {{ .Values.secrets.app.ethereumWalletPrivateKey | b64enc | quote }}
  ethereum-deployer-address: {{ .Values.secrets.app.ethereumDeployerAddress | b64enc | quote }}
  signoz-ingestion-key: {{ .Values.secrets.app.signozIngestionKey | b64enc | quote }}
  aws-access-key-id: {{ .Values.secrets.app.awsAccessKeyId | b64enc | quote }}
  aws-secret-access-key: {{ .Values.secrets.app.awsSecretAccessKey | b64enc | quote }}
  email-from: {{ .Values.secrets.app.emailFrom | b64enc | quote }}
  email-reply-to: {{ .Values.secrets.app.emailReplyTo | b64enc | quote }}
  {{- end }}
  {{- else }}
  # No existing secret configured - use chart values
  sindri-api-key: {{ .Values.secrets.app.sindriApiKey | b64enc | quote }}
  ethereum-rpc-url: {{ .Values.secrets.app.ethereumRpcUrl | b64enc | quote }}
  ethereum-contract-address: {{ .Values.secrets.app.ethereumContractAddress | b64enc | quote }}
  ethereum-wallet-private-key: {{ .Values.secrets.app.ethereumWalletPrivateKey | b64enc | quote }}
  ethereum-deployer-address: {{ .Values.secrets.app.ethereumDeployerAddress | b64enc | quote }}
  signoz-ingestion-key: {{ .Values.secrets.app.signozIngestionKey | b64enc | quote }}
  aws-access-key-id: {{ .Values.secrets.app.awsAccessKeyId | b64enc | quote }}
  aws-secret-access-key: {{ .Values.secrets.app.awsSecretAccessKey | b64enc | quote }}
  email-from: {{ .Values.secrets.app.emailFrom | b64enc | quote }}
  email-reply-to: {{ .Values.secrets.app.emailReplyTo | b64enc | quote }}
  {{- end }}