{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "arda-credit.fullname" . }}
  labels:
    {{- include "arda-credit.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Route API requests to server service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "arda-credit.fullname" $ }}-server
                port:
                  number: {{ $.Values.server.service.port }}
          # Route all other requests to app service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "arda-credit.fullname" $ }}-app
                port:
                  number: {{ $.Values.app.service.port }}
    {{- end }}
{{- end }}