apiVersion: v2
name: arda-credit
description: Arda Credit - Privacy-preserving loan vApp built on SP1 zero-knowledge proofs
type: application
version: 0.4.5
appVersion: "latest"

keywords:
  - blockchain
  - zero-knowledge
  - loans
  - privacy
  - sp1

home: https://github.com/ardaglobal/arda-credit
sources:
  - https://github.com/ardaglobal/arda-credit

maintainers:
  - name: Arda Global
    url: https://github.com/ardaglobal

dependencies:
  - name: postgresql
    version: 15.5.38
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: prometheus-postgres-exporter
    version: 7.1.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.postgresExporter.enabled
  - name: opentelemetry-collector
    version: 0.133.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: monitoring.otelCollector.enabled