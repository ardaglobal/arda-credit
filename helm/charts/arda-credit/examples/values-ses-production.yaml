# Arda Credit Helm Chart Values - Production with AWS/SES Magic Link
# This file demonstrates production-ready configuration with AWS/SES integration

# Global configuration
global:
  imagePullSecrets:
    - name: ghcr-secret

# PostgreSQL configuration (production settings)
postgresql:
  enabled: true
  auth:
    database: "arda_credit_db"
    username: "postgres"
    # Password should be set via --set postgresql.auth.password during deployment
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp3"
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# API Server configuration with AWS/SES
server:
  enabled: true
  replicaCount: 2
  
  image:
    registry: ghcr.io/ardaglobal
    repository: arda-credit
    tag: "latest"
    pullPolicy: Always
  
  # Configuration for ConfigMap (non-sensitive)
  config:
    rustLog: "info"  # Production log level
    serverPort: "8080"
    sindriCircuitTag: "latest"
    
    # AWS/SES Configuration (non-sensitive)
    sesRegion: "us-east-1"
    sesConfigurationSet: "arda-credit-production"  # Optional SES configuration set
    magicBaseUrl: "https://app.arda.xyz/auth/verify"
    emailEnabled: "true"
    emailDebugMode: "false"  # Disabled in production
  
  # Production resource limits
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  
  # High availability settings
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  
  podAntiAffinity:
    enabled: true
    type: "hard"  # Hard anti-affinity for production
    topologyKey: "kubernetes.io/hostname"

# Frontend App configuration
app:
  enabled: true
  replicaCount: 2
  
  image:
    registry: ghcr.io/ardaglobal
    repository: arda-credit-app
    tag: "latest"
    pullPolicy: Always
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# Ingress configuration for production
ingress:
  enabled: true
  className: "alb"
  
  annotations:
    # AWS ALB configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/load-balancer-name: arda-credit-production-alb
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT:certificate/CERT-ID
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    
    # External DNS for Route53
    external-dns.alpha.kubernetes.io/hostname: app.arda.xyz
  
  hosts:
    - host: app.arda.xyz
      paths:
        - path: /api
          pathType: Prefix
          service:
            name: server
            port: 8080
        - path: /
          pathType: Prefix
          service:
            name: app
            port: 80
  
  tls:
    - secretName: arda-credit-tls
      hosts:
        - app.arda.xyz

# Application secrets configuration
secrets:
  # Use external secret in production (created separately)
  existingSecret: ""  # Empty to use chart values
  
  # Fallback values - these should be overridden via external secrets or --set flags
  app:
    sindriApiKey: "your-sindri-api-key"
    ethereumRpcUrl: "https://eth-mainnet.alchemyapi.io/v2/your-key"
    ethereumContractAddress: "0x..."
    ethereumWalletPrivateKey: "0x..."
    ethereumDeployerAddress: "0x..."
    signozIngestionKey: "your-signoz-key"
    
    # AWS/SES Configuration (should be set via external secrets)
    awsAccessKeyId: "your-aws-access-key-id"
    awsSecretAccessKey: "your-aws-secret-access-key"
    emailFrom: "noreply@arda.xyz"
    emailReplyTo: "support@arda.xyz"

# Security contexts for production
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

# Service Account and RBAC
serviceAccount:
  annotations:
    # EKS IAM role for service account (if using IRSA)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/arda-credit-service-role
  automount: false

rbac:
  create: true

# Monitoring configuration
monitoring:
  postgresExporter:
    enabled: true
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi